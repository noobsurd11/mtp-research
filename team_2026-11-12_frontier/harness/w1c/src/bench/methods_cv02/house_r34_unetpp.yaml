    md5: f57b430554b18e1238c4f92eac566544
weights_key: model
decision_rule: argmax24
memory:
  peak_mib: 6830
  gate_mib: 9000
  source: "pf2 smoke SUP100-g, nvidia-smi per process, gaint 31 Oct (build_pf2 gate 5); gate rule peak + 2048"
external: null
notes: "Training code e544133 (el_f3) = el_bench with all bench / thin / f8 keys absent (CPU identity, BUILD_LOG)."
