# House model: U-Net++ (smp 0.5.0) on an ImageNet ResNet-34, 1-channel input, the 100% recipe of pf2_SUP_100pct_s5
# (pf2_jobs.txt 210d0d6f) minus seed / run_name (the queue adds seed, run_name and data.root).
name: house_r34_unetpp
version: 1
family: cnn-unetpp
papers: []
kind: harness
config: configs/supervised.yaml
opts:
  - data.labeled_fraction=1.0
  - training.total_steps=20000
  - data.split_seed=0
  - training.labeled_batch_size=8
  - data.mask_subdir=labeled/masks_escdd
  - model.name=smp_unetpp
  - data.augmentation=labelsafe
